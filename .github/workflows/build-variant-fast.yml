name: Build varimo Fast CPU worker

on:
  push:
    branches:
      - main
    paths:
      - deploy/runpod/Dockerfile.fast
      - deploy/runpod/cp_handler.py
      - variant_maker/*.py
      - variant_maker/server/**
      - pyproject.toml
      - .github/workflows/build-variant-fast.yml
  pull_request:
    paths:
      - deploy/runpod/Dockerfile.fast
      - deploy/runpod/cp_handler.py
      - variant_maker/*.py
      - variant_maker/server/**
      - pyproject.toml
      - .github/workflows/build-variant-fast.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Lab created ghcr.io/snaughtyllc-cell/variant-fast on variant-maker.
  # This repo's GITHUB_TOKEN cannot write that package (write_package).
  # Live-owned image; RunPod stays on the Lab digest until a promote.
  IMAGE: ghcr.io/${{ github.repository }}/variant-fast

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Fast CPU worker
        run: |
          docker build -f deploy/runpod/Dockerfile.fast \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${GITHUB_SHA}" .
          docker push "${IMAGE}:${GITHUB_SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            docker push "${IMAGE}:latest"
          fi
