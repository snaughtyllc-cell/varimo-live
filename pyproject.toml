[project]
name = "variant-maker"
version = "0.2.0"
description = "Local-first AI video variant generator (FFmpeg core + optional neural quality layer)"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# Tier 2 neural ops use EXTERNAL binaries, not pip packages:
#   realesrgan-ncnn-vulkan, rife-ncnn-vulkan  (download separately, see README)
# Tier 3 Drive farm — lazy-imported so the engine stays light + offline-capable:
farm = ["pyyaml>=6", "google-api-python-client>=2", "google-auth>=2", "google-auth-oauthlib>=1"]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "stripe>=12.5",
]
serverless = ["boto3>=1.34"]

[project.scripts]
variant-maker = "variant_maker.cli:main"
variant-farm = "variant_maker.farm.cli:main"
variant-server = "variant_maker.server.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["variant_maker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires ffmpeg + a real clip (slower)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
