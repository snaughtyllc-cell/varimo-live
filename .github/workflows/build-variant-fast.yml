name: Build varimo Fast CPU worker

on:
  push:
    branches:
      - main
    paths:
      - deploy/runpod/Dockerfile.fast
      - deploy/runpod/cp_handler.py
      - variant_maker/*.py
      - variant_maker/server/**
      - pyproject.toml
      - .github/workflows/build-variant-fast.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Live Fast is ghcr.io/snaughtyllc-cell/variant-fast. The package was
      # created from Lab; this repo needs Actions write on it or every push
      # dies with write_package and RunPod keeps the last digest.
      - name: Build and push Fast CPU worker
        run: |
          docker build -f deploy/runpod/Dockerfile.fast \
            -t ghcr.io/snaughtyllc-cell/variant-fast:latest .
          docker push ghcr.io/snaughtyllc-cell/variant-fast:latest
